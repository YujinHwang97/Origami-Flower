<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 6th Monthsary 💜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      background: linear-gradient(135deg, #f69aa9 0%, #f8b4be 48%, #e4b8f2 100%);
      font-family: 'Quicksand', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* Ambient floating hearts layer */
    #hearts-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .floating-heart {
      position: absolute;
      bottom: -30px;
      color: rgba(255, 255, 255, 0.38);
      user-select: none;
      animation: floatUp linear forwards;
    }

    .burst-heart {
      position: fixed;
      pointer-events: none;
      z-index: 30;
      animation: burstFly 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      85% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-110vh) translateX(var(--drift, 20px)) rotate(25deg);
        opacity: 0;
      }
    }

    @keyframes burstFly {
      0% {
        transform: translate(-50%, -50%) scale(0.4);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.25) rotate(var(--rot));
        opacity: 0;
      }
    }

    /* Centerpiece Stage */
    .stage {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      min-height: calc(100dvh - 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Origami Flower Button */
    .flower-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      cursor: pointer;
      user-select: none;
      transition: transform 0.35s ease, opacity 0.5s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .flower-wrapper:hover {
      transform: translateY(-4px) scale(1.03);
    }

    .flower-wrapper.bloomed {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.35);
      position: absolute;
    }

    .origami-flower {
      width: 170px;
      height: 170px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 14px 24px rgba(105, 58, 145, 0.25));
      animation: gentleBob 3.4s ease-in-out infinite;
    }

    @keyframes gentleBob {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }

    .origami-flower svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .petal-group {
      transform-origin: 100px 100px;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .flower-wrapper.opening .petal-outer {
      transform: scale(1.28) rotate(18deg);
    }

    .flower-wrapper.opening .petal-mid {
      transform: scale(1.18) rotate(-14deg);
    }

    .flower-wrapper.opening .petal-inner {
      transform: scale(1.08) rotate(8deg);
    }

    .tap-label {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(6px);
      color: #5b377a;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.4px;
      padding: 8px 20px;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(91, 55, 122, 0.14);
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .flower-wrapper:hover .tap-label {
      background: #ffffff;
    }

    /* Crisp White Letter Card */
    .letter-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 22px;
      padding: 32px 28px;
      box-shadow: 0 20px 45px rgba(95, 52, 124, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.9);
      opacity: 0;
      transform: translateY(24px) scale(0.95);
      pointer-events: none;
      transition: opacity 0.7s ease 0.25s, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.25s;
    }

    .letter-card.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .badge {
      display: inline-block;
      background: #f3e8ff;
      color: #7c3aed;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .letter-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #3b234a;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .letter-body {
      font-family: 'Lora', serif;
      font-size: 1rem;
      line-height: 1.75;
      color: #4a3b54;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-actions {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #f2e8f7;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hug-btn {
      background: linear-gradient(135deg, #a855f7 0%, #c084fc 100%);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 11px 22px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(168, 85, 247, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .hug-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(168, 85, 247, 0.38);
    }

    .hug-btn:active {
      transform: scale(0.96);
    }

    .hug-counter {
      font-size: 0.85rem;
      font-weight: 600;
      color: #8b6a9e;
    }

    .reset-btn {
      background: transparent;
      border: none;
      color: #9e82b0;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .reset-btn:hover {
      color: #6b4685;
    }

    @media (max-width: 480px) {
      .letter-card {
        padding: 26px 20px;
        border-radius: 18px;
      }
      .letter-title {
        font-size: 1.32rem;
      }
      .letter-body {
        font-size: 0.95rem;
        line-height: 1.7;
      }
      .origami-flower {
        width: 150px;
        height: 150px;
      }
    }
  </style>
</head>
<body>
  <div id="hearts-container"></div>

  <main class="stage">
    <!-- Closed Purple Origami Flower -->
    <div class="flower-wrapper" id="flowerTrigger" role="button" tabindex="0" aria-label="Tap to Bloom">
      <div class="origami-flower">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer Folded Origami Petals -->
          <g class="petal-group petal-outer">
            <polygon points="100,14 128,74 100,100 72,74" fill="#b784f7" />
